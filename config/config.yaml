train:
  raw_h_df: "C:/Users/tang/database/SynPop/synthetic_populations/input/H_sample_5%.xlsx"
  raw_p_df: "C:/Users/tang/database/SynPop/synthetic_populations/input/P_sample_5%.xlsx"
  h_nodes: ["H_motor_v", "H_venr_bike"] # Excluding the count of members even though they might be in the household dataframe 
  p_nodes: ["P_gender", "P_work", "P_education", "driver_license", "prepaid_tickets"] # Exclude the origin age column
  age_col: "P_age"
  age_bin: [-1, 5, 14, 17, 29, 39, 49, 59, 69, .inf]
  kid_max_age: 5
  gender_col: "P_gender"
  h_id_col: "H_ID"
  score: "aic-d"
  composition_cols: {"adults":"H_persons_1899","minors":"H_persons_0617","kids":"H_persons_0005"} # User can provide the columns name of member count, if their dataset has the data. In the order of adults, minor and children, one or more cols can be supplied
  # User can provide their own forbidden and required edges for household and person DAGs, in a format list[[(node,node)],[(node,node)]], such as  [("lung", "smoke")].
  expert_knowledge: {"household":{"forbidden_edges":null,"required_edges":null},"person":{"forbidden_edges":null,"required_edges":[['age_cate','P_work'],['P_education','P_work'],['age_cate','P_education'],['age_cate','driver_license']]}}

